<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Viber's Chat CAPTCHA Test</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="container">

    <div class="captcha-box">

        <h1>
            Viber's Chat
        </h1>

        <p class="subtitle">
            CAPTCHA Test
        </p>


        <label for="captchaUrl">
            CAPTCHA URL
        </label>


        <input
            type="text"
            id="captchaUrl"
            placeholder="Paste CAPTCHA URL here"
            autocomplete="off"
        >


        <button
            id="showCaptcha"
            type="button"
        >
            SHOW CAPTCHA
        </button>


        <div class="image-area">

            <iframe
                id="captchaFrame"
                title="CAPTCHA"
            ></iframe>

        </div>


        <div
            id="status"
            class="status"
        >
            Waiting for CAPTCHA URL...
        </div>

    </div>

</div>


<script>

const captchaUrl =
    document.getElementById(
        "captchaUrl"
    );


const showCaptcha =
    document.getElementById(
        "showCaptcha"
    );


const captchaFrame =
    document.getElementById(
        "captchaFrame"
    );


const status =
    document.getElementById(
        "status"
    );


showCaptcha.addEventListener(
    "click",
    function() {

        const url =
            captchaUrl.value.trim();


        if (!url) {

            status.textContent =
                "Please paste the CAPTCHA URL.";

            return;

        }


        status.textContent =
            "Loading CAPTCHA...";


        captchaFrame.src =
            url;


        setTimeout(
            function() {

                status.textContent =
                    "CAPTCHA URL sent to browser.";

            },
            1000
        );

    }
);

</script>


</body>

</html>
