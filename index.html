<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Viber's Chat CAPTCHA</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="container">

    <div class="captcha-box">


        <h1>
            Viber's Chat
        </h1>


        <p class="subtitle">
            CAPTCHA Test
        </p>


        <!-- REFRESH CAPTCHA -->

        <button
            id="refreshCaptcha"
            type="button"
        >
            ↻ REFRESH CAPTCHA
        </button>


        <!-- CAPTCHA URL -->

        <label for="captchaUrl">
            CAPTCHA URL
        </label>


        <input
            type="text"
            id="captchaUrl"
            placeholder="CAPTCHA URL will appear here"
            autocomplete="off"
        >


        <!-- SHOW CAPTCHA -->

        <button
            id="showCaptcha"
            type="button"
        >
            SHOW CAPTCHA
        </button>


        <!-- CAPTCHA IMAGE -->

        <div class="image-area">

            <img
                id="captchaImage"
                alt="CAPTCHA"
            >

        </div>


        <!-- STATUS -->

        <div
            id="status"
            class="status"
        >
            Ready.
        </div>


    </div>


</div>


<script src="app.js"></script>

</body>

</html>
