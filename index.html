<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CAPTCHA Test</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="container">

    <div class="box">

        <h1>Viber's Chat</h1>

        <p>CAPTCHA Test</p>


        <button
            id="refreshCaptcha"
            type="button"
        >
            REFRESH CAPTCHA
        </button>


        <label for="captchaUrl">
            CAPTCHA URL
        </label>


        <input
            id="captchaUrl"
            type="text"
            readonly
            placeholder="CAPTCHA URL will appear here"
        >


        <button
            id="showCaptcha"
            type="button"
        >
            SHOW CAPTCHA
        </button>


        <div class="captcha-container">

            <img
                id="captchaImage"
                alt="CAPTCHA"
            >

        </div>


        <div id="status">
            Ready.
        </div>


    </div>

</div>


<script src="app.js"></script>

</body>

</html>
