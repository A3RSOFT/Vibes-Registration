

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Viber's Chat Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="register-box">

            <h1>Viber's Chat</h1>

            <p class="subtitle">
                Create your account
            </p>

            <form id="registerForm">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <label>
                    CAPTCHA
                </label>

                <div class="captcha-area">

                    <img
                        id="captchaImage"
                        src=""
                        alt="CAPTCHA"
                    >

                    <button
                        type="button"
                        id="refreshCaptcha">
                        ↻
                    </button>

                </div>

                <input
                    type="text"
                    id="captchaCode"
                    placeholder="Enter CAPTCHA"
                    autocomplete="off"
                    required
                >

                <button
                    type="submit"
                    id="registerButton">
                    REGISTER
                </button>

            </form>

            <div id="message"></div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
