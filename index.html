<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Viber's Chat Registration
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="container">


    <div class="register-box">


        <h1>
            Viber's Chat
        </h1>


        <p class="subtitle">
            Create your account
        </p>


        <!-- ========================= -->
        <!-- USERNAME -->
        <!-- ========================= -->

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            autocomplete="username"
        >


        <!-- ========================= -->
        <!-- PASSWORD -->
        <!-- ========================= -->

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="new-password"
        >


        <!-- ========================= -->
        <!-- CAPTCHA -->
        <!-- ========================= -->

        <label>
            CAPTCHA
        </label>


        <div class="captcha-area">


            <img
                id="captchaImage"
                src=""
                alt="CAPTCHA"
            >


            <button
                type="button"
                id="refreshCaptcha"
                title="Get another CAPTCHA"
            >
                ↻
            </button>


        </div>


        <!-- ========================= -->
        <!-- CAPTCHA CODE -->
        <!-- ========================= -->

        <label for="captchaCode">
            Enter CAPTCHA
        </label>


        <input
            type="text"
            id="captchaCode"
            placeholder="Type CAPTCHA"
            autocomplete="off"
        >


        <!-- ========================= -->
        <!-- REGISTER -->
        <!-- ========================= -->

        <button
            type="button"
            id="registerButton"
        >
            REGISTER
        </button>


        <!-- ========================= -->
        <!-- STATUS -->
        <!-- ========================= -->

        <div class="status-title">
            Status
        </div>


        <div
            id="status"
            class="status"
        >
            Waiting...
        </div>


    </div>


</div>


<script src="app.js"></script>


</body>

</html>
