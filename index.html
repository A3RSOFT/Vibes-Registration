
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Viber's Chat CAPTCHA</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="container">

    <div class="box">


        <h1>
            Viber's Chat
        </h1>


        <p class="subtitle">
            CAPTCHA Test
        </p>


        <!-- REFRESH -->

        <button
            id="refreshCaptcha"
            type="button"
        >
            REFRESH CAPTCHA
        </button>


        <!-- CAPTCHA URL -->

        <label for="captchaUrl">
            CAPTCHA URL
        </label>


        <input
            id="captchaUrl"
            type="text"
            placeholder="Paste CAPTCHA URL here"
            autocomplete="off"
        >


        <!-- SHOW -->

        <button
            id="showCaptcha"
            type="button"
        >
            SHOW CAPTCHA
        </button>


        <!-- IMAGE -->

        ```html
<div class="captcha-area">

    <img
        id="captchaImage"
        alt="CAPTCHA"
    >

</div>
    

        <div
            id="status"
            class="status"
        >
            Ready.
        </div>


    </div>

</div>


<script src="app.js"></script>


</body>

</html>
