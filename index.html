<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Viber's Chat Registration</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="registration-box">

        <h1>
            Viber's Chat
        </h1>

        <p>
            Create your account
        </p>


        <label>
            CAPTCHA
        </label>


        <div class="captcha-container">

            <img
                id="captchaImage"
                alt="CAPTCHA"
            >


            <button
                type="button"
                id="refreshCaptcha"
            >
                ↻
            </button>

        </div>


        <input
            id="captchaCode"
            type="text"
            placeholder="Enter CAPTCHA"
        >


        <div id="message">
            Loading...
        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
