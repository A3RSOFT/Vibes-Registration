<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Viber's Chat CAPTCHA API Test</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="container">


    <div class="box">


        <h1>
            CAPTCHA API Test
        </h1>


        <p>
            This test only gets the CAPTCHA API response.
        </p>


        <button
            id="getCaptcha"
            type="button"
        >
            GET CAPTCHA
        </button>


        <label>
            API Response
        </label>


        <textarea
            id="responseBox"
            readonly
            placeholder="Server response will appear here..."
        ></textarea>


        <label>
            Status
        </label>


        <div
            id="status"
            class="status"
        >
            Waiting...
        </div>


    </div>


</div>


<script src="app.js"></script>


</body>

</html>
